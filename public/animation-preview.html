<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChainTrace · Neon network</title><style>
/* Blockchain workspace: keep decorative motion separate from real wallet results. */
:root {
  --background: #070b0d; --foreground: #e8f2f3;
  --card: #0d1418; --card-foreground: #e8f2f3;
  --popover: #121e23; --popover-foreground: #e8f2f3;
  --primary: #4ee4ce; --primary-foreground: #05231e;
  --secondary: #142127; --secondary-foreground: #e8f2f3;
  --muted: #142127; --muted-foreground: #91a7af;
  --accent: #17272d; --accent-foreground: #e8f2f3;
  --border: #203039; --input: #203039; --ring: #4ee4ce;
  --green: #7fe8b2; --red: #f397a7; --radius: .75rem;
}
:root[data-theme="light"] {
  --background: #f2f7f7; --foreground: #122e36;
  --card: #fff; --card-foreground: #122e36;
  --popover: #fff; --popover-foreground: #122e36;
  --primary: #097c6d; --primary-foreground: #fff;
  --secondary: #e4efee; --secondary-foreground: #122e36;
  --muted: #e4efee; --muted-foreground: #526d76;
  --accent: #e0efec; --accent-foreground: #122e36;
  --border: #cbdedc; --input: #cbdedc; --ring: #097c6d;
  --green: #19754b; --red: #ae3552;
}
body {
  background-image: radial-gradient(ellipse at 80% 0%, color-mix(in srgb, var(--primary) 6%, transparent), transparent 45%);
}
::selection { background: color-mix(in srgb, var(--primary) 28%, transparent); }
.topbar { min-height: 80px; height: auto; padding: 20px max(4%, calc((100vw - 1420px) / 2)); gap: 24px; background: color-mix(in srgb, var(--background) 92%, transparent); }
.brand { font-size: 16px; letter-spacing: 2px; gap: 12px; }
.brand > svg { color: var(--primary); }
.brand small { padding-left: 17px; margin-left: 5px; font-size: 9px; }
.header-right { gap: 18px; letter-spacing: .5px; }
.header-right button { width: 38px; height: 38px; margin-left: 0; border-radius: 10px; }
.clock { padding-left: 18px; margin-left: 0; }
.views-badge { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; font-size: 11px; letter-spacing: 0; white-space: nowrap; }
.views-badge svg { color: var(--primary); }
.views-badge strong { color: var(--foreground); font-family: "IBM Plex Mono", monospace; font-weight: 500; font-variant-numeric: tabular-nums; }
.views-badge.counter-failed { color: var(--muted-foreground); }
.workspace { max-width: 1536px; padding-top: 0; }
.page-heading { position: relative; min-height: 322px; margin-bottom: 12px; gap: 24px; }
.page-heading > div:first-child { flex: 1; min-width: 0; padding: 38px 0; }
.eyebrow { color: var(--primary); font-size: 10px; letter-spacing: 2.3px; display: flex; align-items: center; gap: 9px; margin-bottom: 18px; }
.eyebrow::before { content: ""; width: 6px; height: 6px; background: var(--primary); box-shadow: 0 0 14px color-mix(in srgb, var(--primary) 50%, transparent); }
h1 { font-size: clamp(38px, 4.1vw, 60px); line-height: 1.08; font-weight: 600; letter-spacing: -2.6px; max-width: none; }
h1 > span { color: var(--primary); }
.page-heading p { font-size: 14px; line-height: 1.85; margin-top: 18px; max-width: 490px; }
.hero-signals { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 19px; color: var(--muted-foreground); font-size: 11px; }
.hero-signals > span { display: flex; gap: 7px; align-items: center; }
.hero-signals svg { color: var(--primary); }
.blockchain-field { width: min(40%, 460px); position: relative; flex-shrink: 0; background-image: radial-gradient(circle at center, color-mix(in srgb, var(--primary) 6%, transparent), transparent 65%); }
.blockchain-field svg { width: 100%; display: block; }
.field-caption { display: block; text-align: center; font-size: 8px; letter-spacing: 2px; color: var(--muted-foreground); padding-bottom: 14px; }
.search-box { border-radius: 12px; padding: 8px 8px 8px 22px; gap: 15px; min-height: 68px; border-color: color-mix(in srgb, var(--primary) 28%, var(--border)); box-shadow: 0 8px 35px #0000000a; }
.search-box > svg { color: var(--primary); }
.search-box input { font-size: 13px; padding: 14px 0; }
.search-box input::placeholder { color: var(--muted-foreground); }
.search-box:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 12%, transparent); }
.primary { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-foreground); border-radius: 8px; padding: 15px 23px; font-weight: 650; font-size: 13px; }
.search-meta { margin-top: 14px; font-size: 11px; }
.example-link, .hash, .provider-note a { color: var(--primary); }
.section-nav { gap: 12px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 5px; margin-top: 30px; overflow-x: auto; scrollbar-width: thin; }
.section-nav a { padding: 10px 17px; border-radius: 6px; flex-shrink: 0; font-size: 12px; }
.section-nav a.active { border-bottom: 0; background: var(--secondary); color: var(--primary); }
.section-nav a:hover { color: var(--primary); background: var(--secondary); }
.identity { padding: 26px 0 21px; scroll-margin-top: 20px; }
.wallet-avatar { background: color-mix(in srgb, var(--primary) 7%, var(--card)); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 25%, var(--border)); border-radius: 12px; }
.badge { border-radius: 5px; background: var(--card); padding: 7px 9px; }
.stats-grid { background: none; border: 0; border-radius: 0; gap: 14px; overflow: visible; }
.stat { position: relative; border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 22px; min-width: 0; }
.stat:last-child { border: 1px solid var(--border); }
.stat::after { position: absolute; content: ""; left: 22px; top: 0; width: 32px; height: 2px; background: var(--primary); opacity: .6; }
.stat-label { font-size: 10px; letter-spacing: 1.1px; }
.stat strong { font-size: clamp(24px, 2.3vw, 34px); font-weight: 500; margin-top: 19px; letter-spacing: -1px; overflow-wrap: anywhere; }
.stat > span { font-size: 11px; line-height: 1.6; }
.chart-grid { gap: 16px; }
.panel, .gas-details, .scan-panel { border-radius: 12px; }
.panel-heading h2, .section-heading h2 { font-size: 15px; font-weight: 600; }
.panel-heading { padding: 22px; }
.panel-heading p { font-size: 12px; line-height: 1.5; }
.panel-bottom { font-size: 11px; padding: 14px 22px; background: color-mix(in srgb, var(--background) 35%, var(--card)); }
.panel-bottom > span { min-width: 0; }
.chart-empty svg, .table-empty svg, .coverage > svg { color: var(--primary); }
.chart-empty h3, .chart-empty p { text-align: center; }
.blue-dot { background: var(--primary); }
.empty-ring { border-color: var(--border); border-top-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.ranges[data-slot="tabs-list"] { border-radius: 6px; }
.ranges [data-state="active"] { color: var(--primary); }
.network-grid { gap: 14px; }
.network-card { padding: 20px; border-radius: 12px; transition: border-color .2s ease, transform .2s ease; }
.network-card:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); transform: translateY(-2px); }
.network-title h3 { font-size: 13px; }
.network-total { font-size: 26px; margin: 22px 0; }
.network-row { font-size: 11px; line-height: 1.65; }
.provider-note { font-size: 11px; min-height: 2.7em; }
.network-track { height: 3px; }
[data-slot="table-head"] { font-size: 10px; letter-spacing: .7px; }
[data-slot="table-row"]:hover { background: color-mix(in srgb, var(--primary) 3%, var(--card)); }
.market-panel, .recent-panel { scroll-margin-top: 24px; }
.market-panel [data-slot="table-cell"] { height: 68px; }
.secondary-button { border-radius: 6px; min-height: 36px; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
footer { padding: 28px 0; }
.opening { background: var(--background); }
.intro-brand svg { color: var(--primary); }
@media(max-width:1100px) {
  .brand small, .header-status, .clock { display: none; }
  .header-right { gap: 10px; }
  .stat { padding: 20px 17px; }
  .stat::after { left: 17px; }
  .date-value { font-size: 22px !important; }
}
@media(max-width:760px) {
  .topbar { padding: 18px 20px; min-height: 72px; gap: 10px; }
  .brand { font-size: 13px; letter-spacing: 1.2px; gap: 8px; }
  .brand > svg { width: 25px; height: 25px; }
  .views-badge { padding: 8px 9px; gap: 6px; font-size: 10px; }
  .views-badge svg { width: 14px; height: 14px; }
  .header-right button { width: 34px; height: 34px; }
  .workspace { padding: 0 20px; }
  .page-heading { min-height: 275px; margin-bottom: 4px; }
  .page-heading > div:first-child { padding: 32px 0; }
  h1 { font-size: 42px; letter-spacing: -1.9px; }
  .blockchain-field { width: 36%; }
  .hero-break { display: none; }
  .page-heading p { font-size: 13px; }
  .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
  .stat, .stat:nth-child(2), .stat:nth-child(-n+2) { border: 1px solid var(--border); }
  .stat strong { font-size: 28px; }
  .chart-grid { grid-template-columns: 1fr; }
  .search-meta > span:last-child { display: none; }
  .gas-details { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media(max-width:600px) {
  .topbar { flex-wrap: wrap; padding: 16px; }
  .brand { font-size: 12px; }
  .header-right { gap: 7px; }
  .views-badge > span { display: none; }
  .views-badge { gap: 6px; }
  .workspace { padding: 0 16px; }
  .page-heading { min-height: 0; }
  .page-heading > div:first-child { padding: 30px 0 24px; }
  .blockchain-field { display: none; }
  h1 { font-size: clamp(36px,9vw,46px); }
  .eyebrow { font-size: 9px; margin-bottom: 16px; }
  .page-heading p { font-size: 13px; line-height: 1.8; margin-top: 16px; }
  .hero-signals { gap: 15px; font-size: 10px; margin-top: 16px; }
  .search-box { flex-wrap: wrap; padding: 12px; gap: 8px; }
  .search-box input { padding: 10px 0; font-size: 12px; width: calc(100% - 38px); }
  .search-box .primary { width: 100%; min-height: 46px; }
  .search-meta > span:first-child { gap: 7px; font-size: 10px; line-height: 1.6; }
  .example-link { margin-left: 0; font-size: 11px; }
  .section-nav { gap: 3px; margin-top: 23px; }
  .section-nav a { padding: 10px 11px; gap: 6px; font-size: 11px; }
  .section-nav a svg { width: 14px; }
  .stats-grid { gap: 10px; }
  .stat { padding: 18px 14px; }
  .stat::after { left: 14px; }
  .stat-label { font-size: 9px; letter-spacing: .5px; }
  .stat strong { font-size: 25px; }
  .date-value { font-size: 20px !important; }
  .stat > span { font-size: 11px; }
  .panel-heading { padding: 18px; }
  .panel-bottom { flex-wrap: wrap; padding: 13px 18px; font-size: 10px; }
  .network-grid { grid-template-columns: 1fr; gap: 12px; }
  .network-card { padding: 19px; }
  .network-title h3 { font-size: 14px; }
  .network-row, .provider-note { font-size: 12px; }
  .network-total { margin: 18px 0; }
  .provider-note { min-height: 0; }
  .coin-name > span { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; max-width: 105px; }
  .market-panel [data-slot="table-cell"] { font-size: 11px; }
  .market-panel [data-slot="table-head"] { font-size: 9px; }
  .gas-visual { flex-wrap: wrap; height: auto; min-height: 235px; justify-content: center; padding: 15px; }
  .gas-legend { min-width: 120px; }
  .gas-details { padding: 18px; gap: 18px; }
  .coverage { flex-wrap: wrap; }
  .coverage > span { white-space: normal; }
  .table-footer { flex-wrap: wrap; }
  .wallet-heading h2 > span { max-width: 190px; }
}
@media(prefers-reduced-motion:reduce) { .field-node { animation: none; }.network-card:hover { transform: none; } }


/* A single transaction fans out. Only moving packets reveal the invisible routes. */
.flow-field { width: min(49%, 640px); background-image: none; }
.flow-stage { width: 100%; display: block; overflow: visible; }
.flow-source-form { animation: flow-materialize 8s linear infinite; }
@keyframes flow-materialize { 0%,100% { transform: scale(.78); } 7.5%,94% { transform: scale(1); } }
.flow-address { font-family: monospace; text-anchor: middle; }
.flow-address { fill: #39ff14; font-size: 9px; letter-spacing: .6px; opacity: .65; }
:root[data-theme="light"] .flow-address { fill: #176d0d; opacity: .85; }
.flow-field .field-caption { font-size: 8px; opacity: .6; margin-top: 0; }
@media(max-width:760px) { .flow-field { width: 46%; } }
@media(max-width:600px) {
  .page-heading { flex-direction: column; align-items: stretch; gap: 0; }
  .flow-field { display: block; width: 100%; max-width: 460px; margin: 0 auto 18px; }
  .flow-field .field-caption { font-size: 7px; padding-bottom: 0; }
}
@media(prefers-reduced-motion:reduce) {
  .flow-source-form { animation: none; }
  .flow-particle, .flow-impact, .flow-dust { display: none; }
}
