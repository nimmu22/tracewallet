/* A single transaction fans out. Only moving packets reveal the invisible routes. */
.flow-field { width: min(49%, 640px); background-image: none; }
/* SVG colours follow the theme directly, without a second animated tree or a React rerender. */
:root {
  --flow-ink: #39ff14; --flow-edge: #ff334f; --flow-edge-width: 1.3;
  --flow-facet: #d7ffcc; --flow-core: #e9ffe3;
  --flow-glow: #39ff14; --flow-glow-opacity: .45;
  --flow-address-opacity: .65; --flow-source-rest: .78;
}
:root[data-theme="light"] {
  --flow-ink: #087f6d; --flow-edge: #bd4055; --flow-edge-width: .8;
  --flow-facet: #5fc9ae; --flow-core: #e8fff7;
  --flow-glow: #149f8a; --flow-glow-opacity: .12;
  --flow-address-opacity: 1; --flow-source-rest: .92;
}
.flow-stage { width: 100%; display: block; overflow: visible; color: var(--flow-ink); }
.flow-symbols { stroke: var(--flow-edge); stroke-width: var(--flow-edge-width); }
.flow-facet { fill: var(--flow-facet); }
.flow-core { fill: var(--flow-core); }
.flow-bloom { flood-color: var(--flow-glow); flood-opacity: var(--flow-glow-opacity); }
:root[data-theme="light"] .flow-glyph { filter: none; }
:root[data-theme="light"] .flow-dust { opacity: .4; }
:root[data-theme="light"] .flow-impact { opacity: .65; }
.flow-source-form { animation: flow-materialize 8s linear infinite; }
@keyframes flow-materialize { 0%,100% { transform: scale(var(--flow-source-rest)); } 7.5%,94% { transform: scale(1); } }
.flow-address { font-family: monospace; text-anchor: middle; }
.flow-address { fill: var(--flow-ink); font-size: 9px; letter-spacing: .6px; opacity: var(--flow-address-opacity); }

.flow-field .field-caption { font-size: 8px; opacity: .6; margin-top: 0; }
@media(max-width:760px) { .flow-field { width: 46%; } }
@media(max-width:600px) {
  .page-heading { flex-direction: column; align-items: stretch; gap: 0; }
  .flow-field { display: block; width: 100%; max-width: 460px; margin: 0 auto 18px; }
  .flow-field .field-caption { font-size: 7px; padding-bottom: 0; }
}
@media(prefers-reduced-motion:reduce) {
  .flow-source-form { animation: none; }
  .flow-particle, .flow-impact, .flow-dust { display: none; }
}

.provider-retry { background: transparent; color: var(--primary); border: 1px solid currentColor; border-radius: 4px; padding: 5px 9px; margin: 8px 8px 0 0; cursor: pointer; font: inherit; }
.provider-retry:disabled { opacity: .45; cursor: wait; }
.provider-retry:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

/* White surfaces use readable ink and quiet depth instead of dark-mode glow. */
.intro-brand { color: var(--foreground); }
.intro-network { color: var(--primary); }
.opening p { color: var(--muted-foreground); }
:root[data-theme="light"] body {
  background-image: radial-gradient(ellipse at 85% 0%, #e6f1f3 0%, transparent 42%);
}
:root[data-theme="light"] .topbar {
  background: #ffffffed;
  box-shadow: 0 2px 12px #18344505;
}
:root[data-theme="light"] :is(.stat, .panel, .network-card, .scan-panel) {
  box-shadow: 0 2px 4px #18344504, 0 10px 28px #18344504;
}
:root[data-theme="light"] .search-box {
  border-color: #c5d8d5;
  box-shadow: 0 4px 16px #18344506;
}
:root[data-theme="light"] .search-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px #087a6814;
}
:root[data-theme="light"] .search-box.invalid { border-color: var(--red); }
:root[data-theme="light"] .flow-address { font-size: 10px; }
:root[data-theme="light"] .flow-field .field-caption { color: #586b79; opacity: 1; }
:root[data-theme="light"] :is(.coin-monogram, .coin-name small, .meta-divider) { color: var(--muted-foreground); }
:root[data-theme="light"] .network-icon { color: #52627d; background: #edf0f6; }
:root[data-theme="light"] .network-icon.n1 { color: #fff; background: #235bff; }
:root[data-theme="light"] .network-icon.n2 { color: #306b9c; background: #e9f1f8; }
:root[data-theme="light"] .network-icon.n3 { color: #ac3443; background: #fcebee; }
:root[data-theme="light"] .network-icon.n4 { color: #7151ae; background: #f0ebfa; }
:root[data-theme="light"] .network-icon.n5 { color: #8b6515; background: #faf2df; }
:root[data-theme="light"] .network-icon.n6 { color: #af4343; background: #fbecec; }

/* Optional block housings are exposed in the design preview for comparison. */
.flow-node-frame { display: none; fill: var(--card); fill-opacity: .88; stroke: currentColor; stroke-width: .7; stroke-opacity: .25; }
.flow-field[data-flow-style="blocks"] .flow-node-frame { display: block; }
